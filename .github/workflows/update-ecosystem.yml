name: Update opera-eco pin

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Published Git ref"
        required: true
        type: string
      publish_run_url:
        description: "PyPI publication workflow URL"
        required: false
        type: string

concurrency:
  group: opera-eco-pin
  cancel-in-progress: false

permissions:
  contents: read

env:
  MODULE_PACKAGE: forecast_evaluation
  MODULE_PIN: forecast_evaluation
  OPERA_ECO_REPOSITORY: bank-of-england/opera-eco

jobs:
  update-pin:
    runs-on: ubuntu-latest
    steps:
      - name: Check out published source
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: "3.13"

      - name: Read published version
        id: package
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          text = Path("pyproject.toml").read_text(encoding="utf-8")
          match = re.search(r"^version\s*=\s*[\"']([^\"']+)[\"']", text, re.MULTILINE)
          if match is None:
              raise SystemExit("Could not find project version in pyproject.toml")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"version={match.group(1)}\n")
          PY

      - name: Wait for PyPI availability
        env:
          MODULE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          for attempt in {1..30}; do
            if python -m pip download --no-deps --dest "$RUNNER_TEMP/pypi" \
              "${MODULE_PIN}==${MODULE_VERSION}"; then
              exit 0
            fi
            if [[ "$attempt" == 30 ]]; then
              echo "Timed out waiting for ${MODULE_PIN}==${MODULE_VERSION} on PyPI"
              exit 1
            fi
            echo "Package not available yet; retrying in 10 seconds"
            sleep 10
          done

      - name: Check out opera-eco
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          repository: bank-of-england/opera-eco
          token: ${{ secrets.OPERA_ECO_PR_TOKEN }}
          ref: main
          path: opera-eco

      - name: Update pin branch
        env:
          MODULE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail
          branch="bot/update-${MODULE_PIN}"
          git -C opera-eco config user.name "github-actions[bot]"
          git -C opera-eco config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C opera-eco fetch origin main
          git -C opera-eco fetch origin "$branch" 2>/dev/null || true
          git -C opera-eco switch -C "$branch" origin/main
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("opera-eco/pyproject.toml")
          text = path.read_text(encoding="utf-8")
          pin = os.environ["MODULE_PIN"]
          version = os.environ["MODULE_VERSION"]
          pattern = re.compile(
              rf'(?m)^(\s*"{re.escape(pin)}(?:\[[^]]+\])?\s*==\s*)[^"\n]+(.*)$'
          )
          updated, count = pattern.subn(rf'\g<1>{version}\g<2>', text)
          if count != 1:
              raise SystemExit(f"Expected one {pin} pin, found {count}")
          path.write_text(updated, encoding="utf-8")
          PY

      - name: Install published module and pinned ecosystem
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[models]" -e "./opera-eco[modules]"

      - name: Update generated skill APIs
        working-directory: opera-eco
        run: python -m opera.cli skills sync-api

      - name: Commit pin and generated API updates
        id: changes
        env:
          MODULE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail
          branch="bot/update-${MODULE_PIN}"
          git -C opera-eco add pyproject.toml src/opera/skills
          if git -C opera-eco diff --cached --quiet; then
            echo "${MODULE_PACKAGE} is already pinned to ${MODULE_VERSION}"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git -C opera-eco commit -m "deps: update ${MODULE_PACKAGE} to ${MODULE_VERSION}"
          git -C opera-eco push --force-with-lease origin "$branch"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open or update pin pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.OPERA_ECO_PR_TOKEN }}
          MODULE_VERSION: ${{ steps.package.outputs.version }}
          PUBLISH_RUN_URL: ${{ inputs.publish_run_url }}
        run: |
          set -euo pipefail
          branch="bot/update-${MODULE_PIN}"
          title="deps: update ${MODULE_PACKAGE} to ${MODULE_VERSION}"
          body=$(cat <<EOF
          This PR updates the pinned ${MODULE_PACKAGE} version to ${MODULE_VERSION} after its PyPI publication.

          The standard opera-eco package-quality workflow will validate the updated ecosystem.

          Published by: ${PUBLISH_RUN_URL}
          EOF
          )
          pr_url=$(gh pr list --repo "$OPERA_ECO_REPOSITORY" --head "$branch" --state open --json url --jq '.[0].url')
          if [[ -n "$pr_url" ]]; then
            gh pr edit "$pr_url" --title "$title" --body "$body"
          else
            pr_url=$(gh pr create --repo "$OPERA_ECO_REPOSITORY" --head "$branch" --base main --title "$title" --body "$body")
          fi
          gh pr merge "$pr_url" --auto --squash --repo "$OPERA_ECO_REPOSITORY"
